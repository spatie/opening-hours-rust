[package]
name = "spatie-opening-hours"
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Query and format opening hours"
license = "MIT"
repository = "https://github.com/spatie/opening-hours-rust"
documentation = "https://docs.rs/spatie-opening-hours"
readme = "README.md"
keywords = ["spatie"]
categories = ["date-and-time"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
chrono = "0.4.42"
chrono-tz = "0.10.4"
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
